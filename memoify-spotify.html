<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moments of You</title>
<style>
  :root{
    --bg:#000; --panel:#121212; --panel2:#1a1a1a; --hover:#2a2a2a;
    --text:#fff; --muted:#b3b3b3; --green:#1ed760; --accent:#5b3fd1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 84px;gap:8px;height:100vh;padding:8px}

  /* Sidebar */
  .sidebar{grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
  .box{background:var(--panel);border-radius:10px}
  .nav{padding:12px 20px;display:flex;flex-direction:column;gap:6px}
  .nav a{display:flex;align-items:center;gap:16px;padding:10px 0;color:var(--muted);font-weight:700;text-decoration:none;transition:.2s}
  .nav a:hover,.nav a.active{color:#fff}
  .nav svg{width:24px;height:24px;fill:currentColor}
  .library{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .library h3{padding:16px 20px 8px;color:var(--muted);font-size:15px;display:flex;gap:10px;align-items:center}
  .lib-list{overflow-y:auto;padding:0 8px 8px}
  .lib-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
  .lib-item:hover{background:var(--panel2)}
  .lib-item.active{background:var(--hover)}
  .lib-item .cover{width:48px;height:48px;border-radius:4px;flex:none}
  .lib-item b{display:block;font-size:15px;font-weight:500}
  .lib-item small{color:var(--muted);font-size:13px}

  /* Main */
  .main{grid-row:1;overflow-y:auto;border-radius:10px;background:linear-gradient(180deg,#4a3aa8 0,#1c1840 280px,var(--panel) 520px);position:relative}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(18,18,18,.0);backdrop-filter:blur(0)}
  .topbar.scrolled{background:rgba(40,30,100,.9);backdrop-filter:blur(8px)}
  .brand{font-weight:800;letter-spacing:.3px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff7eb3,#7a5cff);border:3px solid #000;box-shadow:0 0 0 1px #333}

  .hero{display:flex;align-items:flex-end;gap:24px;padding:12px 24px 24px}
  .hero .art{width:232px;height:232px;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.55);flex:none}
  .hero small{font-size:13px;font-weight:600}
  .hero h1{font-size:clamp(34px,6.5vw,88px);font-weight:900;line-height:1.05;margin:6px 0 14px;letter-spacing:-2px}
  .hero p{color:#ddd;font-size:15px;margin-bottom:8px}
  .hero .meta{font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hero .meta .dot{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ff7eb3,#7a5cff)}

  .controls{display:flex;align-items:center;gap:24px;padding:12px 24px;background:rgba(0,0,0,.18)}
  .big-play{width:56px;height:56px;border-radius:50%;background:var(--green);display:grid;place-items:center;transition:.15s}
  .big-play:hover{transform:scale(1.06);background:#3be477}
  .big-play svg{width:26px;height:26px;fill:#000}
  .icon-btn{color:var(--muted);transition:.2s}
  .icon-btn:hover{color:#fff}
  .icon-btn svg{width:30px;height:30px;fill:currentColor}
  .icon-btn.on{color:var(--green)}

  .tracks{padding:8px 24px 24px;background:rgba(0,0,0,.18)}
  .row{display:grid;grid-template-columns:40px 1fr 1fr 70px;gap:16px;align-items:center;padding:8px 12px;border-radius:6px;color:var(--muted);font-size:14px}
  .row.head{border-bottom:1px solid #ffffff1f;border-radius:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .row.item{cursor:pointer}
  .row.item:hover{background:#ffffff1a}
  .row .num{text-align:center;font-size:15px}
  .row .title{display:flex;align-items:center;gap:14px;color:#fff;min-width:0}
  .row .title .thumb{width:44px;height:44px;border-radius:4px;flex:none}
  .row .title b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .title small{color:var(--muted);font-size:13px}
  .row.playing .title b,.row.playing .num{color:var(--green)}

  .section{padding:8px 24px 32px}
  .section h2{font-size:24px;margin-bottom:12px;font-weight:800}
  .chips{display:flex;gap:8px;margin-bottom:16px}
  .chip{padding:6px 14px;border-radius:999px;background:#2a2a2a;font-size:14px}
  .chip.on{background:#fff;color:#000}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
  .card{background:var(--panel2);padding:14px;border-radius:8px;cursor:pointer;transition:.2s}
  .card:hover{background:var(--hover)}
  .card .img{aspect-ratio:1;border-radius:6px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .card b{display:block;font-size:15px;margin-bottom:4px}
  .card small{color:var(--muted);font-size:13px}

  /* Player bar */
  .player{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px;background:#000}
  .np{display:flex;align-items:center;gap:14px;min-width:0}
  .np .thumb{width:56px;height:56px;border-radius:4px;flex:none}
  .np b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np small{color:var(--muted);font-size:12px}
  .center{display:flex;flex-direction:column;align-items:center;gap:8px}
  .btns{display:flex;align-items:center;gap:20px}
  .btns .icon-btn svg{width:22px;height:22px}
  .play-sm{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .play-sm:hover{transform:scale(1.06)}
  .play-sm svg{width:18px;height:18px;fill:#000}
  .bar{display:flex;align-items:center;gap:10px;width:100%;max-width:620px;font-size:12px;color:var(--muted)}
  .track{flex:1;height:4px;background:#4d4d4d;border-radius:2px;position:relative;cursor:pointer}
  .track .fill{height:100%;width:0;background:#fff;border-radius:2px;position:relative}
  .track:hover .fill{background:var(--green)}
  .track .fill::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateY(-50%);opacity:0}
  .track:hover .fill::after{opacity:1}
  .right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
  .vol{width:96px}

  .hidden-embed{display:none}

  @media (max-width:860px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;grid-template-rows:auto 78px;height:100vh}
    .sidebar{display:none}
    .hero{flex-direction:column;align-items:flex-start}
    .hero .art{width:180px;height:180px}
    .row{grid-template-columns:28px 1fr 56px}
    .row .album{display:none}
    .player{grid-template-columns:1fr auto}
    .player .right{display:none}
    .bar{display:none}
    .btns .hide-m{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <nav class="box nav">
      <a href="#" class="active">
        <svg viewBox="0 0 24 24"><path d="M12.5 3.2a1 1 0 0 0-1 0L3 8.1V21h6.5v-6h5v6H21V8.1z"/></svg> Home
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.6 13.4l4.5 4.5 1.4-1.4-4.5-4.5A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg> Search
      </a>
    </nav>
    <section class="box library">
      <h3>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 22V2h2v20zm5 0V2h2v20zm5.5 0L11 3l2-.5 4.5 19z"/></svg>
        Your Library
      </h3>
      <div class="lib-list" id="libList"></div>
    </section>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <span class="brand">Talita Afrizahra</span>
      <div style="display:flex;gap:12px;align-items:center">
        <span style="font-size:13px;font-weight:700;background:#fff;color:#000;padding:6px 14px;border-radius:999px">made for mama iyenn  </span>
        <div class="avatar"></div>
      </div>
    </div>

    <div class="hero">
      <div class="art" id="heroArt"></div>
      <div>
        <small>I Love U</small>
        <h1>biggest love</h1>
        <p>A collection of moments, songs, and everything worth replaying.</p>
        <div class="meta"><span class="dot"></span><b>sayanggg mama iyenn</b> • <span id="count">2 memories</span></div>
      </div>
    </div>

    <div class="controls">
      <button class="big-play" id="bigPlay" aria-label="Play"></button>
      <button class="icon-btn" aria-label="Shuffle" id="shuffleBtn">
        <svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5L14.9 10l-1.4-1.4 4.6-4.6zM3 6h4.6l9.5 12H21v2h-4.9L6.6 8H3zm10.5 7.4 1.4 1.4-4.5 4.5L9 17.9zM3 18h4l1.5-1.8 1.4 1.7L8 20H3z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Like" id="likeBtn">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>
      </button>
    </div>

    <div class="tracks">
      <div class="row head"><span class="num">#</span><span>Title</span><span class="album">Album</span><span style="text-align:right">⏱</span></div>
      <div id="trackList"></div>
    </div>

  </main>

  <!-- PLAYER BAR -->
  <footer class="player">
    <div class="np">
      <div class="thumb" id="npThumb"></div>
      <div style="min-width:0">
        <b id="npTitle">Now Playing</b>
        <small id="npArtist">By Me</small>
      </div>
    </div>
    <div class="center">
      <div class="btns">
        <button class="icon-btn hide-m" id="prevBtn" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
        <button class="play-sm" id="playBtn" aria-label="Play/Pause"></button>
        <button class="icon-btn" id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 19V5l9.500 7z"/></svg></button>
      </div>
      <div class="bar">
        <span id="cur">0:00</span>
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
        <span id="dur">2:56</span>
      </div>
    </div>
    <div class="right">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 7.970v8.050A4.500 4.500 0 0 0 16.500 12z"/></svg>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
  </footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* =====================================================
   EDIT DI SINI: ganti judul, foto, dan lagu kamu
   - cover : URL gambar (kosongkan untuk pakai gradien)
   - audio : URL file .mp3 (kosongkan jika belum ada)
   ===================================================== */
const PLAYLIST_NAME = "Our Songs";
// Cover playlist (terpisah dari cover lagu). Isi dengan foto kamu, mis. "cover-playlist.jpg"
const PLAYLIST = { cover:"foto-1.jpg", grad:["#7a5cff","#ff7eb3"] };
const memories = [
  { title:"Iyennnn", sub:"A moment worth replaying", album:"Moments of You", duration:"2:56",
    cover:"foto-2.jpg", grad:["#ff7eb3","#7a5cff"], audio:"hanyakau1.mp3" },
  { title:"Talita Kurusss", sub:"A moment worth replaying", album:"Moments of You", duration:"3:23",
    cover:"foto-3.jpg", grad:["#ffb347","#ff5e62"], audio:"perunggu.mp3" },
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const audio = $("audio");
const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
function paint(el, m){
  if(m.cover){ el.style.background = `url("${m.cover}") center/cover`; }
  else { el.style.background = `linear-gradient(135deg, ${m.grad[0]}, ${m.grad[1]})`; }
}

let index = 0, playing = false, shuffle = false, simTimer = null, simTime = 0;

/* ---------- render ---------- */
function render(){
  // library
  $("libList").innerHTML = "";
  const li = document.createElement("div");
  li.className = "lib-item active";
  li.innerHTML = `<div class="cover"></div>
    <div><b>${PLAYLIST_NAME}</b><small>Playlist • 123 songs</small></div>`;
  paint(li.querySelector(".cover"), PLAYLIST);
  $("libList").appendChild(li);

  // hero
  paint($("heroArt"), PLAYLIST);
  $("count").textContent = memories.length + " memories";

  // tracks
  $("trackList").innerHTML = "";
  memories.forEach((m,i)=>{
    const r = document.createElement("div");
    r.className = "row item" + (i===index && playing ? " playing":"");
    r.innerHTML = `<span class="num">${i+1}</span>
      <div class="title"><div class="thumb"></div><div style="min-width:0"><b>${m.title}</b><small>${m.sub}</small></div></div>
      <span class="album">${m.album}</span>
      <span style="text-align:right">${m.duration}</span>`;
    paint(r.querySelector(".thumb"), m);
    r.onclick = () => select(i, true);
    $("trackList").appendChild(r);
  });

  updateNow();
  updatePlayIcons();
}

function updateNow(){
  const m = memories[index];
  $("npTitle").textContent = m.title;
  $("npArtist").textContent = "By Me";
  paint($("npThumb"), m);
  $("dur").textContent = m.duration;
}
function updatePlayIcons(){
  const ic = playing ? ICON_PAUSE : ICON_PLAY;
  $("bigPlay").innerHTML = ic;
  $("playBtn").innerHTML = ic;
  document.querySelectorAll(".row.item").forEach((r,i)=>r.classList.toggle("playing", i===index && playing));
}

/* ---------- playback (pakai audio asli jika ada, kalau tidak simulasi) ---------- */
function totalSeconds(){
  if(audio.src && isFinite(audio.duration)) return audio.duration;
  const [m,s] = memories[index].duration.split(":").map(Number);
  return m*60+s;
}
function select(i, autoplay){
  index = i;
  const m = memories[i];
  clearInterval(simTimer); simTime = 0;
  if(m.audio){ audio.src = m.audio; } else { audio.removeAttribute("src"); audio.load(); }
  setProgress(0);
  updateNow();
  if(autoplay) play(); else { playing=false; updatePlayIcons(); }
}
function play(){
  playing = true;
  if(memories[index].audio){ audio.play().catch(()=>{}); }
  else {
    clearInterval(simTimer);
    simTimer = setInterval(()=>{
      simTime += 0.25;
      if(simTime >= totalSeconds()){ next(); return; }
      setProgress(simTime);
    },250);
  }
  updatePlayIcons();
}
function pause(){
  playing = false;
  audio.pause(); clearInterval(simTimer);
  updatePlayIcons();
}
function toggle(){ playing ? pause() : play(); }
function next(){
  const n = shuffle ? Math.floor(Math.random()*memories.length) : (index+1)%memories.length;
  select(n, true);
}
function prev(){
  if(audio.currentTime>3 || simTime>3){ select(index, playing); return; }
  select((index-1+memories.length)%memories.length, true);
}
function setProgress(t){
  const total = totalSeconds();
  $("cur").textContent = fmt(t);
  $("fill").style.width = (t/total*100) + "%";
}

audio.addEventListener("timeupdate", ()=>setProgress(audio.currentTime));
audio.addEventListener("loadedmetadata", ()=>$("dur").textContent = fmt(audio.duration));
audio.addEventListener("ended", next);
audio.volume = 0.8;

$("bigPlay").onclick = $("playBtn").onclick = toggle;
$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
$("vol").oninput = e => audio.volume = e.target.value;
$("shuffleBtn").onclick = e => { shuffle=!shuffle; e.currentTarget.classList.toggle("on",shuffle); };
$("likeBtn").onclick = e => e.currentTarget.classList.toggle("on");
$("track").onclick = e => {
  const rect = $("track").getBoundingClientRect();
  const t = (e.clientX-rect.left)/rect.width * totalSeconds();
  if(memories[index].audio) audio.currentTime = t; else simTime = t;
  setProgress(t);
};
$("main").addEventListener("scroll", e=>$("topbar").classList.toggle("scrolled", e.target.scrollTop>180));
document.addEventListener("keydown", e=>{ if(e.code==="Space" && e.target===document.body){ e.preventDefault(); toggle(); }});

render();
</script>
</body>
</html>
